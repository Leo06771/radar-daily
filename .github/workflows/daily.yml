name: daily-radar

on:
  schedule:
    # 每天 07:00 Asia/Shanghai = 23:00 UTC
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: generate radar.json
        run: python3 scripts/update_radar.py --out data/radar.json
      - name: commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/radar.json
          git diff --cached --quiet || git commit -m "radar $(TZ=Asia/Shanghai date +%F)"
          git push
